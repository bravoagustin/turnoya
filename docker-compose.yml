services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: turnoya
      POSTGRES_USER: turnoya
      POSTGRES_PASSWORD: turnoya
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turnoya"]
      interval: 5s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://postgres:5432/turnoya
    ports:
      - "8080:8080"
